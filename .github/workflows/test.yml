name: Gateway tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.2'
      - run: npm run check
      - run: npm run privacy-check
      - run: npm run privacy:test
      - run: npm test
      - run: npm run continuity:test
      - run: npm run data:test
      - run: npm run memory:test
      - run: npm run recovery:test
  predictor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.8
      - run: uv sync --locked --project predictor
      - run: uv run --locked --project predictor python -m unittest discover -s predictor -v
      - run: uv run --locked --project ds4-gateway/encoder python -m unittest discover -s ds4-gateway/encoder -v
