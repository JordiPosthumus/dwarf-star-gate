name: Gateway tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.2'
      - run: npm run check
      - run: npm run privacy-check
      - run: npm run privacy:test
      - run: npm test
      - run: npm run continuity:test
      - run: npm run data:test
      - run: npm run memory:test
      - run: npm run recovery:test
